name: factory gate
description: Decide whether an agent may run for this stage from state on GitHub. Fails the job with the reason when it may not.
inputs:
  for:
    description: The stage, currently plan
    required: true
  issue:
    description: The issue number
    required: true
  bot:
    description: The factory App's login, without the [bot] suffix
    required: true
  token:
    description: A token that can read issues
    required: true
  plan-out:
    description: For the build stage, the file to write the App's plan comment to
    default: ""
  safe-outputs:
    description: The gh-aw safe-outputs file; a blocked decision writes a noop there so the agent is skipped cleanly
    default: ${{ runner.temp }}/gh-aw/safeoutputs/outputs.jsonl
runs:
  using: composite
  steps:
    - shell: bash
      env:
        STAGE: ${{ inputs.for }}
        ISSUE: ${{ inputs.issue }}
        BOT: ${{ inputs.bot }}
        GITHUB_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        PLAN_OUT: ${{ inputs.plan-out }}
        SAFE_OUTPUTS: ${{ inputs.safe-outputs }}
      run: |
        set -euo pipefail
        if [ -n "$PLAN_OUT" ]; then
          node "$GITHUB_ACTION_PATH/../../ci/gate.mjs" --for "$STAGE" --repo "$REPO" --issue "$ISSUE" --bot "$BOT" --plan-out "$PLAN_OUT" --safe-outputs "$SAFE_OUTPUTS"
        else
          node "$GITHUB_ACTION_PATH/../../ci/gate.mjs" --for "$STAGE" --repo "$REPO" --issue "$ISSUE" --bot "$BOT" --safe-outputs "$SAFE_OUTPUTS"
        fi
